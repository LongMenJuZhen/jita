[package]
name = "jita"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jita"
path = "src/main.rs"

[lib]
name = "jita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System
dirs = "6.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 0
lto = false

[dev-dependencies]
tempfile = "3.0"